name: CI Pipeline

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    test:
        name: megatron
        runs-on: ubuntu-latest

        steps:
           - name: Checkout Github code
             uses: actions/checkout@v4

           - name: Setup Node.js
             uses: actions/setup-node@v4
             with:
                node-version: '20'

           - name: Cache node modules 
             uses: actions/cache@v4
             with:
                path: ~/.npm
                key: ${{runner.os}}-npm-${{hashFiles('**/package-lock.json')}}
                restore-keys:
                    ${{runner.os}}-npm-

           - run: npm install
           - run: npm start


    
        
            